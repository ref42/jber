[package]
name = "jber"
version = "1.0.0"
edition = "2024"
description = "Turn Altium, KiCad and EasyEDA Gerber archives into JLCPCB-ready sets"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ref42/jber"
keywords = ["gerber", "jlcpcb", "kicad", "altium", "eda"]
categories = ["command-line-utilities"]

[dependencies]
chrono = "0.4.45"
md-5 = "0.11.0"
zip = "9.2.2"

[profile.release]
lto = true
strip = true
