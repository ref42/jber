name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: jber

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: linux-x64
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            asset: linux-arm64
            musl: true
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: macos-x64
            musl: false
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: macos-arm64
            musl: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: windows-x64.exe
            musl: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            asset: windows-arm64.exe
            musl: false
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Collect binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/${BIN_NAME}-${version}-${{ matrix.asset }}"
          chmod +x "dist/${BIN_NAME}-${version}-${{ matrix.asset }}"

      - name: Collect binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG -replace '^v', ''
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" "dist/$env:BIN_NAME-$version-${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          repo="${GITHUB_REPOSITORY}"

          ls -l dist

          notes=$(cat <<'EOF'
          Single-file builds: no installer and no archive. On macOS and Linux run
          `chmod +x` on the download first.

          | file | platform |
          | --- | --- |
          | `jber-<version>-windows-x64.exe` | Windows 10/11, x64 |
          | `jber-<version>-windows-arm64.exe` | Windows 11 on ARM |
          | `jber-<version>-macos-arm64` | macOS, Apple silicon |
          | `jber-<version>-macos-x64` | macOS, Intel |
          | `jber-<version>-linux-x64` | Linux x86_64 (static) |
          | `jber-<version>-linux-arm64` | Linux arm64 (static) |
          EOF
          )
          notes="${notes}"$'\n\n'"**Full changelog**: https://github.com/${repo}/commits/${tag}"

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$repo" --yes
          fi

          gh release create "$tag" dist/* \
            --repo "$repo" \
            --title "${tag#v}" \
            --notes "$notes" \
            --verify-tag
